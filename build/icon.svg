<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Icono de Tintero: un tintero con una plumilla y una etiqueta con los colores de las tres apps. -->
  <defs>
    <linearGradient id="fondo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b6fd1"/>
      <stop offset="1" stop-color="#1c3a7a"/>
    </linearGradient>
    <linearGradient id="vidrio" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e9eef8"/>
      <stop offset="0.5" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#d7dfee"/>
    </linearGradient>
    <linearGradient id="tinta" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e3f8f"/>
      <stop offset="1" stop-color="#0f1f4d"/>
    </linearGradient>
    <linearGradient id="plumilla" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fde68a"/>
      <stop offset="1" stop-color="#d4a017"/>
    </linearGradient>
    <filter id="sombra" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#0b1840" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Fondo: cuadrado redondeado con el margen que macOS espera (824 px sobre 1024). -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#fondo)"/>

  <g filter="url(#sombra)">
    <!-- Plumilla, inclinada, con la punta dentro del tintero. -->
    <g transform="rotate(24 512 470)">
      <rect x="462" y="150" width="100" height="80" rx="14" fill="#0f1f4d"/>
      <path d="M452 226 L572 226 L572 290 C572 370 545 430 512 520 C479 430 452 370 452 290 Z" fill="url(#plumilla)"/>
      <line x1="512" y1="330" x2="512" y2="512" stroke="#8a6508" stroke-width="9" stroke-linecap="round"/>
      <circle cx="512" cy="326" r="17" fill="#8a6508"/>
    </g>

    <!-- Cuerpo del tintero: cuello, boca y vaso ancho. -->
    <rect x="432" y="470" width="160" height="70" rx="16" fill="url(#vidrio)"/>
    <rect x="410" y="450" width="204" height="38" rx="19" fill="#ffffff"/>
    <path d="M300 590 C300 548 336 528 380 528 L644 528 C688 528 724 548 724 590 L724 760 C724 800 694 820 654 820 L370 820 C330 820 300 800 300 760 Z"
          fill="url(#vidrio)"/>
    <!-- Tinta dentro del vaso, con la superficie ondulada. -->
    <path d="M326 640 C390 620 440 660 512 640 C584 620 634 660 698 640 L698 752 C698 780 676 794 648 794 L376 794 C348 794 326 780 326 752 Z"
          fill="url(#tinta)"/>
    <!-- Etiqueta: Texto, Diapositivas y Hojas de cálculo. -->
    <rect x="392" y="686" width="72" height="44" rx="10" fill="#2f5aa8" stroke="#ffffff" stroke-width="6"/>
    <rect x="476" y="686" width="72" height="44" rx="10" fill="#c2410c" stroke="#ffffff" stroke-width="6"/>
    <rect x="560" y="686" width="72" height="44" rx="10" fill="#1f7a4d" stroke="#ffffff" stroke-width="6"/>
    <!-- Brillo del vidrio. -->
    <path d="M336 600 C336 572 352 560 378 558" stroke="#ffffff" stroke-width="14" stroke-linecap="round" fill="none" opacity="0.9"/>
  </g>
</svg>
