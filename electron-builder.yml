# Configuración de los instaladores. Documentación: https://www.electron.build
appId: io.github.tonelo2244.tintero
productName: Tintero
copyright: Copyright © 2026 tonelo

directories:
  output: dist
  buildResources: build

# Solo el código ya compilado por electron-vite. Las librerías de la interfaz (React, Tiptap...)
# van dentro del bundle de out/renderer, por eso están en devDependencies y no se copian otra vez.
files:
  - out/**
  - package.json

# Doble clic en un .tdoc, .tpres o .tsheet => se abre con Tintero.
fileAssociations:
  - ext: tdoc
    name: Documento de Tintero
    description: Documento de Tintero Texto
    mimeType: application/x-tintero-document
    role: Editor
  - ext: tpres
    name: Presentación de Tintero
    description: Presentación de Tintero Diapositivas
    mimeType: application/x-tintero-presentation
    role: Editor
  - ext: tsheet
    name: Hoja de cálculo de Tintero
    description: Hoja de cálculo de Tintero Hojas de cálculo
    mimeType: application/x-tintero-spreadsheet
    role: Editor

win:
  target: nsis
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  artifactName: ${productName}-Setup-${version}.${ext}

mac:
  target: dmg
  category: public.app-category.productivity
  # Sin certificado de Apple Developer usamos firma "ad-hoc" ("-"). En Mac con chip Apple
  # es obligatoria: un binario arm64 sin firma válida no arranca y macOS dice que "está dañado".
  # No sustituye a la firma de Apple: Gatekeeper seguirá pidiendo "Abrir" la primera vez.
  identity: '-'
  # El runtime endurecido rechaza los frameworks de Electron firmados por otro equipo
  # cuando la app solo tiene firma ad-hoc; hasta tener certificado, lo desactivamos.
  hardenedRuntime: false
dmg:
  artifactName: ${productName}-${version}-${arch}.${ext}

linux:
  target: AppImage
  category: Office
  syncDesktopName: true
  artifactName: ${productName}-${version}-${arch}.${ext}

publish: null
