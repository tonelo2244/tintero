name: CI

# Se ejecuta en cada PR y en cada push a main: nada entra en main sin pasar por aquí.
on:
  pull_request:
  push:
    branches: [main]

# Si subes otro commit al mismo PR, cancela la ejecución anterior (ahorra minutos).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Lint, typecheck, tests y build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # `npm ci` instala exactamente lo que dice package-lock.json (builds reproducibles).
      # ELECTRON_SKIP_BINARY_DOWNLOAD: para typecheck/tests no hace falta el binario de Electron.
      - name: Instalar dependencias
        run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

      - name: Lint
        run: npm run lint

      - name: Formato
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

  e2e:
    name: Tests e2e (Electron + Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # Aquí sí hace falta el binario de Electron: las pruebas arrancan la app de verdad.
      - name: Instalar dependencias
        run: npm ci

      - name: Compilar
        run: npm run build

      # Linux sin pantalla: xvfb-run le da a Electron una pantalla virtual.
      # La IA se prueba contra un Ollama simulado que arranca la propia prueba (e2e/support/fakeOllama.ts).
      - name: Tests e2e
        run: |
          command -v xvfb-run || (sudo apt-get update && sudo apt-get install -y xvfb)
          # pdftotext (poppler-utils): la prueba de la fase 15 lee el texto de cada hoja del PDF.
          command -v pdftotext || (sudo apt-get update && sudo apt-get install -y poppler-utils)
          xvfb-run -a npx playwright test

      # Si algo falla, el informe HTML (con capturas del momento del fallo) queda descargable en el resumen del run.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: informe-e2e
          path: |
            playwright-report
            test-results
          retention-days: 7
