name: Instaladores

# - Al subir una etiqueta vX.Y.Z: construye los tres instaladores y crea una Release en GitHub.
# - A mano (pestaña Actions → "Run workflow"): los construye y los deja como artefactos.
# - En PRs que tocan el empaquetado: comprueba que siguen construyéndose en los tres sistemas.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
  pull_request:
    paths:
      - electron-builder.yml
      - package.json
      - package-lock.json
      - .github/workflows/release.yml

permissions:
  contents: read

jobs:
  build:
    name: Instalador (${{ matrix.name }})
    # Cada instalador se construye en su propio sistema operativo: electron-builder
    # no puede generar un .dmg desde Linux, por ejemplo.
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            target: --win
          - name: macOS
            os: macos-latest
            target: --mac
          - name: Linux
            os: ubuntu-latest
            target: --linux
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar
        run: npm run build

      - name: Empaquetar
        run: npx electron-builder ${{ matrix.target }} --publish never
        env:
          # Sin certificado de Apple: que no intente buscar uno en el llavero.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - uses: actions/upload-artifact@v4
        with:
          name: tintero-${{ matrix.name }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.AppImage
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publicar Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: installers/*
          generate_release_notes: true
